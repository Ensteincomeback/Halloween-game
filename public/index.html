<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Knock: Trick-or-Treat</title>
  <meta name="description" content="Knock on doors. Collect candy. Survive monsters.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Start menu -->
  <section id="start" class="screen" hidden>
    <div class="start-card">
      <div class="start-title">KNOCK</div>
      <p class="tagline">Knock on doors. Collect candy. Survive monsters.</p>
      <canvas id="start-preview" width="96" height="192" aria-label="Your character"></canvas>
      <form id="start-form">
        <label class="field">
          <span>Character name</span>
          <input id="start-name" maxlength="20" placeholder="Your trick-or-treater" autocomplete="nickname">
        </label>
        <p id="start-returning" class="muted small" hidden>Welcome back! <span id="start-returning-name"></span> · <a href="#" id="btn-new-character">New character</a></p>
        <div class="field">
          <span>Solana wallet <em class="muted">(optional · preview)</em></span>
          <button type="button" id="btn-wallet" class="btn wallet-btn">◎ Connect wallet</button>
          <div id="wallet-connected" class="wallet-connected" hidden>
            <span>◎ <b id="wallet-addr"></b></span><span class="badge">Devnet preview</span>
            <button type="button" id="btn-wallet-disconnect" class="btn small">Disconnect</button>
          </div>
        </div>
        <button class="btn primary big" id="btn-play" type="submit">▶ Play</button>
        <button type="button" class="btn" id="btn-start-help">❔ How to play</button>
      </form>
      <p class="fine">90% Tricks. 10% Treats.</p>
    </div>
  </section>

  <!-- Game -->
  <section id="game" class="screen" hidden>
    <div id="stage"></div>

    <header class="hud">
      <div class="hud-left">
        <span class="logo small">KNOCK</span>
        <span id="hud-player" class="chip"></span>
      </div>
      <div class="hud-stats">
        <div class="stat" title="Knocks left (refill over time and daily)"><span class="lbl">Knocks</span><span id="hud-knocks" class="val"></span><span id="hud-regen" class="sub"></span></div>
        <div class="stat" title="Candy in your bucket can be stolen. Deposit it at the Candy Bank."><span class="lbl">Bucket</span><span id="hud-bag" class="val"></span><div class="bar"><div id="hud-bag-bar"></div></div></div>
        <div class="stat" title="Candy in the bank is safe"><span class="lbl">Bank</span><span id="hud-stash" class="val"></span></div>
        <div class="stat" title="Danger rises the longer you stay out. A bank trip resets it."><span class="lbl">Night</span><span id="hud-night" class="val"></span><div class="bar night"><div id="hud-night-bar"></div></div></div>
        <div class="stat" title="Daily streak"><span class="lbl">Streak</span><span id="hud-streak" class="val"></span></div>
        <div class="stat" id="hud-boo-wrap" hidden title="Your $BOO balance"><span class="lbl">$BOO</span><span id="hud-boo" class="val"></span></div>
      </div>
      <div class="hud-right">
        <button id="btn-dev" class="btn dev-btn" hidden>DEV</button>
        <button id="btn-help-hud" class="btn" title="How to play (H)">❔</button>
        <button id="btn-menu" class="btn">☰ Menu <kbd>Tab</kbd></button>
      </div>
    </header>

    <div id="banners"></div>
    <canvas id="minimap" width="160" height="160" title="Map: pink = Candy Bank, yellow = for sale / gatekeeper, orange = Hot House, white = today's route"></canvas>
    <div id="tutorial" hidden></div>
    <div id="prompt" hidden></div>
    <button id="btn-action" class="btn primary" hidden>Knock</button>
    <div id="joystick" hidden><div id="joystick-knob"></div></div>
    <div id="controls-hint">WASD move · Shift run · E knock / talk · Tab menu · H help</div>
    <div id="devpanel" hidden></div>

    <aside id="drawer" class="side">
      <nav class="tabs" role="tablist">
        <button data-tab="porch" class="active">House</button>
        <button data-tab="missions">Missions</button>
        <button data-tab="shop">Shop</button>
        <button data-tab="board">Board</button>
        <button data-tab="leaders">Leaders</button>
        <button data-tab="feed">Feed</button>
        <button data-tab="me">Me</button>
        <button data-tab="streets" id="tab-btn-streets" hidden>Streets</button>
        <button id="btn-close-drawer" title="Close">✕</button>
      </nav>
      <div id="tab-porch" class="tab active"></div>
      <div id="tab-missions" class="tab"></div>
      <div id="tab-shop" class="tab"></div>
      <div id="tab-board" class="tab"></div>
      <div id="tab-leaders" class="tab"></div>
      <div id="tab-feed" class="tab"></div>
      <div id="tab-me" class="tab"></div>
      <div id="tab-streets" class="tab"></div>
    </aside>
  </section>

  <div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
