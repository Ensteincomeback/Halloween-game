[package]
name = "knock"
version = "0.1.0"
description = "Knock on-chain programs: house market escrow, raffle escrow, fee split and the monster bond"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "knock"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
